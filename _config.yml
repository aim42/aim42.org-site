# aim42.org site settings. The site uses its own layouts in _layouts/ (no theme gem).

title: aim42
description: "Architecture Improvement Method: systematic modernization and evolution of IT systems."
url: "https://aim42.org"
baseurl: ""
repository: "aim42/aim42.org-site" # used by the "Edit this pattern on GitHub" links

include:
  - .htaccess
  - _pages
exclude:
  - vendor
  - .asset-cache
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - tmp
  - /zz-resources
  - Makefile
  - docker-compose.yml
  - netlify.toml
  - _docker
  - tools
  - tests
  - docs
keep_files:
  - .git

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap

collections:
  patterns:
    output: true
    permalink: /patterns/:name/
    sort_by: title

defaults:
  - scope:
      path: ""
      type: patterns
    values:
      layout: pattern
