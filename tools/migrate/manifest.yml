# What the one-off conversion produces. Paths in `source` are relative to
# _import/src/main/asciidoc: "file.adoc" converts the whole file,
# "file.adoc#Anchor" the section that starts at [[Anchor]],
# "pattern-index.adoc#Anchor" the one-line entry of a stub.
# Pilot patterns were converted by hand in phase 1; run.rb leaves them alone.
# `intent` overrides the intent found in the source.

glossary:
