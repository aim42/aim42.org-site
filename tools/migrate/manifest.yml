  - anchor: database-first-approach
    slug: database-first-approach
    title: Database First Approach
    phase: improve
    categories: [approaches]
    source: patterns/improve/database-first-approach.adoc
    # intent: the one-liner from improve-approaches.adoc; the file has none
    intent: Do a Big-Bang migration of the database, incrementally implement new applications and interfaces and connect the legacy system to the new database by forward gateways.
  - anchor: database-last-approach
    slug: database-last-approach
    title: Database Last Approach
    phase: improve
    categories: [approaches]
    source: patterns/improve/database-last-approach.adoc
    # intent: the one-liner from improve-approaches.adoc; the file has none
    intent: Keep the existing database for a limited time, incrementally implement new applications and interfaces and connect them to the legacy database by reverse gateways.
